# The economy engine of the world server: a thin shell around the unchanged port of BeforeIT.jl
# (github.com/ramonfueglister/port-beforeit, Apache-2.0, see THIRD_PARTY/port-beforeit). The shell only loads the
# parameters, computes periods, hands out key figures and saves and loads the state of the model. It is built to one
# WebAssembly file that the world server loads (npm run economy:build, server/Dockerfile).
[package]
name = "sc-economy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# pinned to one commit: the model of the world changes only when this line does
beforeit = { git = "https://github.com/ramonfueglister/port-beforeit", rev = "729153175fa6ca86f67ee62aa2f8fbabec136217", default-features = false }

[profile.release]
opt-level = 3
