# The economy engine of the world server: a shell around the unchanged port of BeforeIT.jl
# (once github.com/ramonfueglister/port-beforeit, now in vendor/port-beforeit, Apache-2.0, see THIRD_PARTY/port-beforeit). The shell loads the
# parameters, computes periods, hands out key figures and saves and loads the state of the model; src/clock.rs is the
# model type that lets the port compute one day per period. It is built to one WebAssembly file that the world
# server loads (npm run economy:build, server/Dockerfile).
[package]
name = "sc-economy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the port at commit 729153175fa6ca86f67ee62aa2f8fbabec136217 of github.com/ramonfueglister/port-beforeit, kept in
# vendor/ since that repository is gone (18 November 2026): the model of the world changes only when vendor/ does
beforeit = { path = "vendor/port-beforeit", default-features = false }
# the mathematical functions the port itself uses, so that the native build and WebAssembly agree bit for bit
libm = "0.2"

[lints.clippy]
# the port computes over several arrays by one index, as the paper writes it; an iterator over one of them reads worse
needless_range_loop = "allow"

[profile.release]
opt-level = 3

[dev-dependencies]
# to read the calibration of a city of the game in tests/benefit.rs; the port itself depends on it
serde_json = "1"
