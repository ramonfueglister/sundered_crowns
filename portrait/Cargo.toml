# The portraits of the people: head and shoulders built from a person's genes, age, estate and life. The builder is
# the portrait generator of Apoleia (github.com/ramonfueglister/apoleia, sim/portrait, commit c30a107), carried over
# unchanged except for the lines listed in THIRD_PARTY/apoleia-portrait/CHANGES.md. It is built to one WebAssembly
# file that the game loads in the browser (npm run portrait:build); src/portrait/ draws its triangles with three.js.
[package]
name = "sc-portrait"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# zstd in plain Rust (the data files are zstd frames; the C library does not build for the browser)
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
