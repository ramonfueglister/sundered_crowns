# Fly.io app for one world server. Deploy from the repository root:
#   fly deploy . --config server/fly.toml --dockerfile server/Dockerfile
# (the build context must be the repository root: the image needs src/, tools/sim/ and public/data/)
app = "grand-strategy-game"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  PORT = "8787"
  WORLD_DATA_DIR = "/data"
  WORLD_ID = "europa-1"
  WORLD_NAME = "Europa I"
  SECONDS_PER_DAY = "36"
  MAX_PLAYERS = "100"

# persistent disk for snapshots and the command log (one volume = one machine = one world)
[[mounts]]
  source = "world_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"      # the world clock must keep running
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 300

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
