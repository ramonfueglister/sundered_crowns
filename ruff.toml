# Python checks for the data tools in tools/ (README.md, "Tests"): pyflakes (unused imports and variables, names that
# are not defined), syntax errors, one import per line, sorted imports, stray whitespace; and the layout of
# `ruff format`. CI runs `ruff check` and `ruff format --check` in the lint job.
target-version = "py311"
line-length = 120
extend-exclude = [
  "economy/vendor",  # a copy of someone else's code
  "tools/portrait",  # the portrait generator, while its open pull request (#84) changes it
]

[lint]
select = ["F", "E9", "E401", "W", "I"]

[format]
quote-style = "single"
